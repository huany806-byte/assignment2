<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Too Many Tabs Open!</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><div class="wallpaper" aria-hidden="true"></div><main class="window"><header class="chrome"><div class="tabs"><span class="tab active">⌕ My Tabs <b>×</b></span><span class="tab">📊 Data <b>×</b></span><span class="tab">✦ Charts <b>×</b></span><span class="plus">+</span></div><div class="address"><span class="dots">←　→　↻</span><span class="url">🔒 chrome://my-tabs</span><span>☆　⋮</span></div></header><section class="content"><div class="eyebrow">CHROME TABS · SAMPLE DATA</div><h1>Too Many Tabs <em>Open!</em></h1><p class="intro">Tab distribution by category and website.</p><div class="stats"><div class="stat"><span>OPEN TABS</span><strong>40</strong><small>Total tabs</small></div><div class="stat"><span>ENTERTAINMENT</span><strong>60%</strong><small>24 tabs</small></div><div class="stat"><span>WEBSITES</span><strong>9</strong><small>Unique websites</small></div></div><section class="panel"><div class="paneltop"><div><span class="eyebrow">DATA VISUALIZATION</span><h2>Tab Distribution</h2></div><div class="controls"><label for="view">Show</label><select id="view"><option value="category">By category</option><option value="website">By website</option></select><label for="type">Chart</label><select id="type"><option value="doughnut">Doughnut</option><option value="bar">Bar</option></select></div></div><div class="chartwrap"><canvas id="tabsChart" role="img" aria-label="Chart showing the number of open browser tabs by category or website"></canvas></div><p id="chartNote" class="chartnote">Hover to view tab counts.</p></section></section></main><script src="script.js"></script></body></html>
